spring:
  application:
    name: nacos-config-discovery-simple
  cloud:
    nacos:
      config:
        name: ${spring.application.name}
        server-addr: 10.96.55.103:8848
        namespace: dev
        shared-configs:
          - data-id: global.properties
            refresh: true
      discovery:
        server-addr: 10.96.55.103:8848
        namespace: dev
  main:
    allow-bean-definition-overriding: true
