# application
spring.application.name=kafka-spring-boot-sample

# jdbc
spring.datasource.url=jdbc:mysql://10.96.15.155:3306/test?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=28800

# kafka

# producer
spring.kafka.producer.client-id=scm-${spring.application.name}
spring.kafka.producer.transaction-id-prefix=kafka-tx-
spring.kafka.producer.bootstrap-servers=192.168.1.226:32192, 192.168.1.217:32292, 192.168.1.205:32392
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# consumer
spring.kafka.consumer.bootstrap-servers=192.168.1.226:32192, 192.168.1.217:32292, 192.168.1.205:32392
spring.kafka.consumer.client-id=scm-${spring.application.name}
spring.kafka.consumer.group-id=scm-${spring.kafka.consumer.client-id}
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.listener.client-id=scm-${spring.application.name}
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
