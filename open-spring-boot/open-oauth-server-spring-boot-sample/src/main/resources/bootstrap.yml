spring:
  profiles:
    active: default
  application:
    name: open-oauth-server-spring-boot-sample
  cloud:
    nacos:
      config:
        name: ${spring.application.name}
        shared-configs:
          - data-id: global.properties
            refresh: true
  main:
    allow-bean-definition-overriding: true
server:
  port: 9999
open:
  oauth:
    access-token-validity-seconds: 30
---
spring:
  profiles: default
  cloud:
    nacos:
      config:
        server-addr: 10.96.55.103:8848
        namespace: dev
