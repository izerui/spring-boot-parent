spring:
  application:
    name: gateway-spring-boot-sample
  cloud:
    nacos:
      config:
        name: ${spring.application.name}
        server-addr: 10.96.55.103:8848
        namespace: dev
        shared-configs:
          - data-id: global.properties
            refresh: true
      discovery:
        server-addr: 10.96.55.103:8848
        namespace: dev
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      filter:
        remove-hop-by-hop:
          headers:
            - access-control-allow-credentials
            - access-control-allow-headers
            - access-control-allow-methods
            - access-control-allow-origin
            - access-control-max-age
      loadbalancer:
        ribbon:
          enabled: false
  main:
    allow-bean-definition-overriding: true
  #redis:
server:
  port: 8083
# 网关配置
gateway:
  ignored-urls:
    - /oauth/token
    - /oauth/refresh
    - /oauth/token_key
    - /ignore
  oauth2:
    client-id: ierp
    client-secret: 123456
    app-name: oauth2-server-spring-boot-opaque-sample
    auth-type: opaque_rest
  maintenance: false